<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>외부 사이트 모음 · 디자인 기초 키트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F6;--surface:#FFFFFF;--ink:#14213D;--muted:#55607A;--line:#CBD3E1;
  --accent:#2B4BFF;--pop:#FFD23F;--on-pop:#14213D;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1524;--surface:#18203A;--ink:#EEF1F8;--muted:#A5AFC7;--line:#2C3757;--accent:#7C93FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1524;--surface:#18203A;--ink:#EEF1F8;--muted:#A5AFC7;--line:#2C3757;--accent:#7C93FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.back{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;background:var(--surface)}
.back:hover{background:var(--pop);color:var(--on-pop)}

.hero{padding:40px 0 20px}
.hero h1{margin:0;font-weight:900;font-size:clamp(36px,8vw,72px);line-height:1.1;letter-spacing:-.03em}
.hero p{margin:16px 0 0;font-size:clamp(16px,2.2vw,19px);color:var(--muted);max-width:32em}

section{margin-top:44px}
section h2{margin:0;font-size:26px;font-weight:900;letter-spacing:-.01em;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.note{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--pop);background:var(--surface);color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;list-style:none;margin:18px 0 0;padding:0}
.card{display:flex;flex-direction:column;gap:6px;height:100%;padding:18px;background:var(--surface);border:2px solid var(--ink);border-radius:6px;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--accent)}
.card b{font-size:18px;font-weight:900}
.card span{font-size:15px;color:var(--muted)}
.card small{margin-top:auto;padding-top:8px;font-size:13px;color:var(--accent);overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><nav class="site-nav" aria-label="사이트 전체 메뉴">
<a href="index.html">홈</a><a href="layout_grid.html">레이아웃 그리드</a><a href="design_theory.html">디자인 이론</a><a href="design_assets.html">디자인 에셋</a><a href="external_sites.html">외부 사이트</a>
</nav>
<style>
.site-nav{display:flex;flex-wrap:wrap;gap:8px;max-width:1040px;margin:18px auto 0;padding:0 20px}
.site-nav a{display:inline-block;padding:8px 13px;border:1px solid var(--line,#CBD3E1);border-radius:999px;text-decoration:none;color:var(--ink,#14213D);font-size:13px;background:var(--surface,#fff)}
.site-nav a:hover{background:var(--accent,#2B4BFF);color:#fff}
@media(max-width:560px){.site-nav{gap:6px}.site-nav a{font-size:12px;padding:7px 10px}}
</style>
<div class="wrap">
  <a class="back" id="backLink" href="index.html">처음으로</a>

  <header class="hero">
    <h1>외부 사이트 모음</h1>
    <p>포스터를 만들 때 자주 쓰는 사이트를 용도별로 모았어요. 카드를 누르면 새 탭에서 열려요.</p>
  </header>

  <main id="main"></main>
</div>

<script>
var DATA = [
  {title:"컬러 팔레트", items:[
    {name:"Adobe Color", desc:"색상환으로 어울리는 색 조합을 만들어요.", url:"https://color.adobe.com/kr/create/color-wheel"},
    {name:"Color Hunt", desc:"다른 사람이 만든 팔레트를 둘러보고 골라요.", url:"https://colorhunt.co/"},
    {name:"Colorspace", desc:"기준 색 하나로 어울리는 팔레트를 만들어 줘요.", url:"https://mycolor.space/"},
    {name:"Color-Hex", desc:"이름이 붙은 팔레트와 색상 코드를 찾아봐요.", url:"https://www.color-hex.com/color-palettes/"}
  ]},
  {title:"무료 폰트", note:"캔바와 미리캔버스의 폰트는 유료 계정에서만 쓸 수 있어요. 아래 사이트에서 받은 폰트를 쓰면 편해요.", items:[
    {name:"눈누", desc:"상업적으로 써도 되는 한글 폰트를 모아 놨어요.", url:"https://noonnu.cc/"},
    {name:"네이버 한글 폰트", desc:"네이버가 배포하는 한글 폰트를 받을 수 있어요.", url:"https://hangeul.naver.com/font"},
    {name:"Google Fonts", desc:"전 세계에서 많이 쓰는 무료 폰트 모음이에요.", url:"https://fonts.google.com/"}
  ]},
  {title:"이미지 요소", items:[
    {name:"Flaticon 픽토그램", desc:"안내 표지판 같은 단순한 그림 기호를 찾아요.", url:"https://www.flaticon.com/kr/free-icons/pictogram"},
    {name:"Flaticon 아이콘", desc:"다양한 스타일의 아이콘을 검색해요.", url:"https://www.flaticon.com/"},
    {name:"Icons8", desc:"브랜드 아이콘을 찾을 때 쓰기 좋아요.", url:"https://icons8.kr/icons/all"},
    {name:"픽사베이", desc:"사진, 일러스트, 벡터 이미지를 찾아요.", url:"https://pixabay.com/ko/"},
    {name:"언스플래시", desc:"분위기 있는 고화질 사진을 찾아요.", url:"https://unsplash.com/ko"},
    {name:"펙셀스", desc:"사진과 영상 소스를 찾아요.", url:"https://www.pexels.com/ko-kr/"},
    {name:"이모지 키친", desc:"이모지 모음 사이트에요. 아이콘으로 쓸 수 있어요.", url:"https://emojikitchen.dev/"},
    {name:"UI Gradients", desc:"그래디언트 배경 색 조합을 골라요.", url:"https://uigradients.com/"}
  ]},
  {title:"기타 도구", items:[
    {name:"remove.bg", desc:"사진의 배경을 자동으로 지워 줘요.", url:"https://www.remove.bg/"},
    {name:"핀터레스트", desc:"원하는 느낌의 포스터 레퍼런스를 찾아요.", url:"https://kr.pinterest.com/"}
  ]},
  {title:"제작 사이트", items:[
    {name:"미리캔버스", desc:"템플릿을 골라 바로 포스터를 만들어요.", url:"https://www.miricanvas.com/"},
    {name:"캔바", desc:"템플릿으로 포스터와 카드뉴스를 만들어요.", url:"https://www.canva.com/ko_kr/"},
    {name:"피그마", desc:"자유롭게 디자인해요. 프로그램 설치가 필요해요.", url:"https://www.figma.com/ko-kr/"},
    {name:"망고보드", desc:"템플릿 기반으로 포스터와 상세페이지를 만들어요.", url:"https://www.mangoboard.net/"}
  ]}
];

var main = document.getElementById("main");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
DATA.forEach(function(cat){
  var sec = document.createElement("section");
  var html = '<h2>' + esc(cat.title) + '</h2>';
  if(cat.note) html += '<p class="note">' + esc(cat.note) + '</p>';
  html += '<ul class="grid">' + cat.items.map(function(it){
    var host = it.url.replace(/^https?:\/\/(www\.)?/, "").split("/")[0];
    return '<li><a class="card" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer"><b>' + esc(it.name) + '</b><span>' + esc(it.desc) + '</span><small>' + esc(host) + '</small></a></li>';
  }).join("") + '</ul>';
  sec.innerHTML = html;
  main.appendChild(sec);
});
</script>
</body>
</html>
