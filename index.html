<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디자인 기초 키트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F6;--surface:#FFFFFF;--ink:#14213D;--muted:#55607A;--line:#CBD3E1;
  --accent:#2B4BFF;--on-accent:#FFFFFF;--pop:#FFD23F;--on-pop:#14213D;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1524;--surface:#18203A;--ink:#EEF1F8;--muted:#A5AFC7;--line:#2C3757;
    --accent:#7C93FF;--on-accent:#0F1524;--pop:#FFD23F;--on-pop:#14213D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1524;--surface:#18203A;--ink:#EEF1F8;--muted:#A5AFC7;--line:#2C3757;
  --accent:#7C93FF;--on-accent:#0F1524;--pop:#FFD23F;--on-pop:#14213D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 56px}

/* 헤더 */
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.brand{font-weight:500;font-size:15px;color:var(--muted)}
.help{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--pop);color:var(--on-pop);font:900 22px/1 "Noto Sans KR",sans-serif;cursor:pointer}
.help:hover{transform:rotate(-8deg)}
.help:focus-visible,.tile:focus-visible,.nav button:focus-visible,.dots button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* 히어로: 글자 크기 위계를 그대로 보여주는 제목 */
.hero{padding:56px 0 44px}
.hero h1{margin:0;font-weight:900;font-size:clamp(44px,10vw,104px);line-height:1.05;letter-spacing:-.03em}
.hero p{margin:20px 0 0;font-size:clamp(16px,2.2vw,20px);color:var(--muted);max-width:30em}

/* 메뉴 타일 */
.menu{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;list-style:none;margin:0;padding:0}
.menu li{grid-column:span 3}
.menu li:nth-child(-n+2){grid-column:span 3}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:28px;width:100%;height:100%;min-height:170px;padding:22px;text-align:left;text-decoration:none;color:inherit;background:var(--surface);border:2px solid var(--ink);border-radius:6px;cursor:pointer;font:inherit;transition:transform .15s,background .15s,color .15s}
.tile:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--accent)}
.tile svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile h2{margin:0;font-size:22px;font-weight:900;letter-spacing:-.01em}
.tile span{display:block;margin-top:2px;font-size:15px;color:var(--muted)}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:6px;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 사용 방법 캐러셀 */
dialog{width:min(520px,calc(100% - 32px));padding:0;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog::backdrop{background:rgba(10,15,30,.6)}
.close{position:absolute;top:10px;right:10px;width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--ink);font-size:24px;cursor:pointer;z-index:2}
.viewport{overflow:hidden;touch-action:pan-y}
.track{display:flex;transition:transform .3s ease}
.slide{flex:0 0 100%;padding:48px 28px 12px;min-height:290px}
.slide .big{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--pop);color:var(--on-pop);border:2px solid var(--ink);font-weight:900;font-size:30px}
.slide h3{margin:22px 0 8px;font-size:24px;font-weight:900;letter-spacing:-.01em}
.slide p{margin:0;color:var(--muted);font-size:16px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 20px}
.nav button{min-width:72px;height:44px;border-radius:6px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:500 15px "Noto Sans KR",sans-serif;cursor:pointer}
.nav button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.nav button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:8px}
.dots button{width:12px;height:12px;padding:0;border-radius:50%;border:2px solid var(--ink);background:transparent;cursor:pointer}
.dots button[aria-current="true"]{background:var(--ink)}

@media (max-width:720px){
  .menu{grid-template-columns:1fr}
  .menu li,.menu li:nth-child(-n+2){grid-column:auto}
  .tile{min-height:140px}
  .hero{padding:36px 0 32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><nav class="site-nav" aria-label="사이트 전체 메뉴">
<a href="index.html">홈</a><a href="layout_grid.html">레이아웃 그리드</a><a href="design_theory.html">디자인 이론</a><a href="design_assets.html">디자인 에셋</a><a href="external_sites.html">외부 사이트</a>
</nav>
<style>
.site-nav{display:flex;flex-wrap:wrap;gap:8px;max-width:1040px;margin:18px auto 0;padding:0 20px}
.site-nav a{display:inline-block;padding:8px 13px;border:1px solid var(--line,#CBD3E1);border-radius:999px;text-decoration:none;color:var(--ink,#14213D);font-size:13px;background:var(--surface,#fff)}
.site-nav a:hover{background:var(--accent,#2B4BFF);color:#fff}
@media(max-width:560px){.site-nav{gap:6px}.site-nav a{font-size:12px;padding:7px 10px}}
</style>
<div class="wrap">
  <header class="top">
    <div class="brand">디자인 기초 키트</div>
    <button class="help" id="helpBtn" aria-label="사용 방법 보기" aria-haspopup="dialog">?</button>
  </header>

  <section class="hero">
    <h1>읽히는 포스터는<br>기초에서 시작해요</h1>
    <p>템플릿과 에셋을 가져다 쓰고, 꼭 필요한 이론만 익혀서 한눈에 읽히는 포스터를 만들어 보세요.</p>
  </section>

  <nav aria-label="메뉴">
    <ul class="menu" id="menu"></ul>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="guide" aria-label="사용 방법">
  <button class="close" id="closeBtn" aria-label="닫기">×</button>
  <div class="viewport" id="viewport"><div class="track" id="track"></div></div>
  <div class="nav">
    <button id="prev">이전</button>
    <div class="dots" id="dots"></div>
    <button id="next" class="primary">다음</button>
  </div>
</dialog>

<script>
/* 메뉴 설정: href에 페이지 주소를 넣으면 그 화면으로 이동해요. 항목을 추가하려면 한 줄만 더하면 돼요. */
var MENU = [
  {title:"레이아웃 그리드", desc:"포스터에 맞는 그리드 제안", href:"layout_grid.html",
   icon:'<rect x="4" y="4" width="16" height="16"/><path d="M4 12h16M12 4v16"/>'},
  {title:"외부 사이트 모음", desc:"컬러 팔레트, 폰트 사이트", href:"external_sites.html",
   icon:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'},
  {title:"디자인 에셋", desc:"미술 사조별 그래픽 소스", href:"design_assets.html",
   icon:'<rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="10" r="1.5"/><path d="m3 17 5-4 4 3 3-2 6 4"/>'},
  {title:"디자인 이론", desc:"가독성을 높이는 원리", href:"design_theory.html",
   icon:'<path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/>'}
];

/* 사용 방법 슬라이드 */
var GUIDE = [
  {mark:"1", title:"메뉴를 골라요", text:"첫 화면의 버튼에서 지금 필요한 주제를 선택하면 해당 화면으로 이동해요."},
  {mark:"2", title:"기준을 참고해요", text:"그리드와 폰트 크기 기준표를 보고 내 포스터에 맞는 값을 골라 적용해요."},
  {mark:"3", title:"에셋을 가져가요", text:"템플릿과 디자인 요소를 내려받아 바로 포스터에 사용할 수 있어요."},
  {mark:"4", title:"이유를 확인해요", text:"디자인 이론에서 왜 그렇게 배치하는지 알면 다음 작업이 훨씬 쉬워져요."}
];

var menu = document.getElementById("menu"), toast = document.getElementById("toast"), tt;
function say(msg){
  toast.textContent = msg; toast.classList.add("on");
  clearTimeout(tt); tt = setTimeout(function(){ toast.classList.remove("on"); }, 1800);
}
MENU.forEach(function(m){
  var li = document.createElement("li");
  var a = document.createElement(m.href ? "a" : "button");
  a.className = "tile";
  if(m.href) a.href = m.href; else a.type = "button";
  a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + m.icon + '</svg><div><h2>' + m.title + '</h2><span>' + m.desc + '</span></div>';
  if(!m.href) a.addEventListener("click", function(){ say("이 화면은 준비 중이에요."); });
  li.appendChild(a); menu.appendChild(li);
});

/* 캐러셀 */
var dlg = document.getElementById("guide"), track = document.getElementById("track"),
    dots = document.getElementById("dots"), prev = document.getElementById("prev"),
    next = document.getElementById("next"), vp = document.getElementById("viewport"), idx = 0;
GUIDE.forEach(function(g, i){
  var s = document.createElement("div");
  s.className = "slide";
  s.innerHTML = '<div class="big" aria-hidden="true">' + g.mark + '</div><h3>' + g.title + '</h3><p>' + g.text + '</p>';
  track.appendChild(s);
  var d = document.createElement("button");
  d.setAttribute("aria-label", (i+1) + "번째 안내로 이동");
  d.addEventListener("click", function(){ go(i); });
  dots.appendChild(d);
});
function go(i){
  idx = Math.max(0, Math.min(GUIDE.length - 1, i));
  track.style.transform = "translateX(" + (-100 * idx) + "%)";
  Array.prototype.forEach.call(dots.children, function(d, k){ d.setAttribute("aria-current", k === idx ? "true" : "false"); });
  prev.disabled = idx === 0;
  next.textContent = idx === GUIDE.length - 1 ? "시작하기" : "다음";
}
prev.addEventListener("click", function(){ go(idx - 1); });
next.addEventListener("click", function(){ if(idx === GUIDE.length - 1) dlg.close(); else go(idx + 1); });
document.getElementById("helpBtn").addEventListener("click", function(){ go(0); dlg.showModal(); });
document.getElementById("closeBtn").addEventListener("click", function(){ dlg.close(); });
dlg.addEventListener("click", function(e){ if(e.target === dlg) dlg.close(); });
dlg.addEventListener("keydown", function(e){
  if(e.key === "ArrowLeft") go(idx - 1);
  if(e.key === "ArrowRight") go(idx + 1);
});
var sx = null;
vp.addEventListener("pointerdown", function(e){ sx = e.clientX; });
vp.addEventListener("pointerup", function(e){
  if(sx === null) return;
  var dx = e.clientX - sx; sx = null;
  if(Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
});
go(0);
</script>
</body>
</html>
